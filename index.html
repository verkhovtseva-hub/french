<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Français — 10 минут в день</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e12; --surface: #16161d; --surface2: #1e1e28;
  --border: rgba(255,255,255,0.08); --accent: #c9a96e; --accent2: #7c9eff;
  --text: #f0ede6; --text-muted: rgba(240,237,230,0.5); --text-dim: rgba(240,237,230,0.25);
  --green: #5cb882; --red: #e07070; --purple: #a78bfa; --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 16px 40px; }
body::before { content: ''; position: fixed; top: -200px; left: 50%; transform: translateX(-50%); width: 600px; height: 400px; background: radial-gradient(ellipse, rgba(201,169,110,0.07) 0%, transparent 70%); pointer-events: none; z-index: 0; }
header { width: 100%; max-width: 700px; display: flex; align-items: center; justify-content: space-between; padding: 28px 0 24px; position: relative; z-index: 1; }
.logo { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--accent); letter-spacing: 0.02em; }
.logo span { color: var(--text-muted); font-size: 14px; font-family: 'DM Sans', sans-serif; display: block; margin-top: 2px; font-weight: 300; }
.timer-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.timer-svg circle.bg { stroke: var(--border); }
.timer-svg circle.prog { stroke: var(--accent); stroke-dasharray: 188.5; stroke-dashoffset: 0; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 1s linear, stroke 0.5s; }
.timer-label { font-size: 17px; font-weight: 500; color: var(--text); position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); white-space: nowrap; }
.timer-sub { font-size: 11px; color: var(--text-muted); text-align: center; letter-spacing: 0.08em; text-transform: uppercase; }
main { width: 100%; max-width: 700px; position: relative; z-index: 1; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px; margin-bottom: 28px; flex-wrap: wrap; }
.tab { flex: 1; padding: 9px 12px; border-radius: 999px; background: none; border: none; color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; text-align: center; min-width: 70px; }
.tab.active { background: var(--surface2); color: var(--text); font-weight: 500; }
.tab:hover:not(.active) { color: var(--text); }
.panel { display: none; }
.panel.active { display: block; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 2rem 1.5rem; cursor: pointer; position: relative; transition: border-color 0.2s, transform 0.15s; overflow: hidden; margin-bottom: 20px; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.4; }
.card:hover { border-color: rgba(201,169,110,0.25); transform: translateY(-1px); }
.card-badge { position: absolute; top: 14px; left: 16px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); background: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.2); border-radius: 999px; padding: 2px 10px; }
.card-hint { position: absolute; bottom: 14px; right: 16px; font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; }
.card-fr { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 600; color: var(--text); text-align: center; line-height: 1.2; margin-bottom: 8px; }
.card-pron { font-size: 14px; color: var(--accent); text-align: center; margin-bottom: 4px; }
.card-ru { font-size: 20px; color: var(--accent2); text-align: center; margin-top: 14px; font-weight: 300; animation: fadeIn 0.25s ease; }
.card-example { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; width: 100%; font-style: italic; line-height: 1.6; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.progress-text { font-size: 12px; color: var(--text-muted); letter-spacing: 0.05em; }
.btn-row { display: flex; gap: 8px; }
.btn { padding: 9px 20px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.btn:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); }
.btn-know { background: rgba(92,184,130,0.12); border-color: rgba(92,184,130,0.3); color: var(--green); }
.btn-know:hover { background: rgba(92,184,130,0.2); }
.btn-learn { background: rgba(224,112,112,0.1); border-color: rgba(224,112,112,0.25); color: var(--red); }
.btn-learn:hover { background: rgba(224,112,112,0.18); }
.btn-next { background: rgba(201,169,110,0.12); border-color: rgba(201,169,110,0.3); color: var(--accent); }
.btn-next:hover { background: rgba(201,169,110,0.2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 12px; text-align: center; }
.stat-n { font-size: 26px; font-weight: 500; color: var(--text); }
.stat-l { font-size: 11px; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.06em; text-transform: uppercase; }
.stat-n.green { color: var(--green); }
.stat-n.red { color: var(--red); }
.streak-bar { display: flex; gap: 6px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }
.streak-day { width: 30px; height: 30px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-muted); }
.streak-day.done { background: rgba(92,184,130,0.15); border-color: rgba(92,184,130,0.35); color: var(--green); }
.streak-day.today { border-color: var(--accent); color: var(--accent); }
.streak-label { font-size: 11px; color: var(--text-dim); margin-left: 6px; letter-spacing: 0.06em; text-transform: uppercase; }
.filter-row { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-btn { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: none; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all 0.15s; }
.filter-btn.active { background: rgba(201,169,110,0.12); border-color: rgba(201,169,110,0.3); color: var(--accent); }
.gram-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 18px; }
.gram-title { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--accent); margin-bottom: 14px; }
.gram-rule { font-size: 14px; color: var(--text-muted); line-height: 1.8; margin-bottom: 10px; }
.gram-example { font-size: 14px; color: var(--accent2); font-style: italic; margin-top: 8px; line-height: 1.7; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
td, th { padding: 8px 12px; border: 1px solid var(--border); color: var(--text-muted); }
th { background: rgba(255,255,255,0.04); color: var(--text); font-weight: 500; }
tr:hover td { background: rgba(255,255,255,0.02); }
.done-screen { text-align: center; padding: 3rem 1rem; animation: fadeIn 0.4s ease; }
.done-flag { font-size: 56px; margin-bottom: 16px; }
.done-title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--accent); margin-bottom: 8px; }
.done-sub { font-size: 15px; color: var(--text-muted); line-height: 1.7; }
.done-stats { display: flex; gap: 20px; justify-content: center; margin: 24px 0; }
.done-stat { text-align: center; }
.done-stat span { display: block; font-size: 28px; font-weight: 500; color: var(--text); }
.done-stat small { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.btn-restart { margin-top: 20px; padding: 12px 32px; border-radius: 999px; background: rgba(201,169,110,0.12); border: 1px solid rgba(201,169,110,0.35); color: var(--accent); font-family: 'DM Sans', sans-serif; font-size: 15px; cursor: pointer; transition: all 0.2s; }
.btn-restart:hover { background: rgba(201,169,110,0.2); }
@media (max-width: 480px) { .card-fr { font-size: 24px; } }
</style>
</head>
<body>
<header>
  <div class="logo">Le Français <span>10 минут в день</span></div>
  <div class="timer-wrap">
    <div style="position:relative;width:64px;height:64px;">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle class="bg" cx="32" cy="32" r="28" fill="none" stroke-width="3"/>
        <circle class="prog" id="timer-arc" cx="32" cy="32" r="28" fill="none" stroke-width="3"/>
      </svg>
      <span class="timer-label" id="timer-text">10:00</span>
    </div>
    <div class="timer-sub" id="timer-status">старт →</div>
  </div>
</header>
<main>
  <div class="streak-bar" id="streak-bar"></div>
  <div class="tabs" role="tablist">
    <button class="tab active" onclick="switchTab('words',this)">🃏 Слова</button>
    <button class="tab" onclick="switchTab('phrases',this)">💬 Фразы</button>
    <button class="tab" onclick="switchTab('grammar',this)">📖 Грамматика</button>
  </div>

  <!-- WORDS -->
  <div class="panel active" id="panel-words">
    <div class="filter-row" id="cat-filters"></div>
    <div class="card" id="word-card" onclick="flipWord()">
      <div class="card-badge" id="w-cat"></div>
      <div class="card-fr" id="w-fr"></div>
      <div class="card-pron" id="w-pron"></div>
      <div id="w-ru" class="card-ru" style="display:none"></div>
      <div id="w-ex" class="card-example" style="display:none"></div>
      <div class="card-hint" id="w-hint">нажми чтобы открыть</div>
    </div>
    <div class="controls">
      <span class="progress-text" id="w-prog"></span>
      <div class="btn-row" id="w-btns" style="display:none">
        <button class="btn btn-learn" onclick="markWord(false)">Не знал</button>
        <button class="btn btn-know" onclick="markWord(true)">Знал ✓</button>
      </div>
      <button class="btn btn-next" id="w-next" style="display:none" onclick="nextWord()">Следующее →</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n green" id="s-know">0</div><div class="stat-l">Знаю</div></div>
      <div class="stat"><div class="stat-n red" id="s-nope">0</div><div class="stat-l">Учу</div></div>
      <div class="stat"><div class="stat-n" id="s-tot">0</div><div class="stat-l">Всего</div></div>
    </div>
  </div>

  <!-- PHRASES -->
  <div class="panel" id="panel-phrases">
    <div class="card" id="ph-card" onclick="flipPhrase()">
      <div class="card-badge" id="ph-cat"></div>
      <div class="card-fr" id="ph-fr" style="font-size:22px"></div>
      <div class="card-pron" id="ph-pron"></div>
      <div id="ph-ru" class="card-ru" style="display:none"></div>
      <div class="card-hint" id="ph-hint">нажми чтобы открыть</div>
    </div>
    <div class="controls">
      <span class="progress-text" id="ph-prog"></span>
      <button class="btn btn-next" onclick="nextPhrase()">Следующая →</button>
    </div>
  </div>

  <!-- GRAMMAR -->
  <div class="panel" id="panel-grammar">
    <div id="gram-content"></div>
    <div class="controls">
      <span class="progress-text" id="gr-prog"></span>
      <button class="btn btn-next" onclick="nextGram()">Следующая тема →</button>
    </div>
  </div>
</main>

<script>
const WORDS = [
  // Приветствия
  {fr:"Bonjour",ru:"Привет / Добрый день",pron:"[бо-жур]",cat:"Приветствия",ex:"Bonjour! Comment ça va? → Привет! Как дела?"},
  {fr:"Bonsoir",ru:"Добрый вечер",pron:"[бон-суар]",cat:"Приветствия",ex:"Bonsoir, madame. → Добрый вечер, мадам."},
  {fr:"Salut",ru:"Привет / Пока (неформально)",pron:"[са-лю]",cat:"Приветствия",ex:"Salut! Ça va? → Привет! Как дела?"},
  // Вежливость
  {fr:"Merci",ru:"Спасибо",pron:"[мэр-си]",cat:"Вежливость",ex:"Merci beaucoup! → Большое спасибо!"},
  {fr:"S'il vous plaît",ru:"Пожалуйста",pron:"[силь-ву-плэ]",cat:"Вежливость",ex:"Un café, s'il vous plaît. → Кофе, пожалуйста."},
  {fr:"Excusez-moi",ru:"Извините",pron:"[экс-кю-зэ-муа]",cat:"Вежливость",ex:"Excusez-moi, où est la gare? → Извините, где вокзал?"},
  {fr:"De rien",ru:"Пожалуйста (не за что)",pron:"[дё рьен]",cat:"Вежливость",ex:"Merci! — De rien. → Спасибо! — Не за что."},
  // Глагол être
  {fr:"Je suis",ru:"Я есть (я являюсь)",pron:"[жё сюи]",cat:"Глагол être",ex:"Je suis français. → Я француз."},
  {fr:"Tu es",ru:"Ты есть",pron:"[тю э]",cat:"Глагол être",ex:"Tu es gentil. → Ты добрый."},
  {fr:"Il est / Elle est",ru:"Он есть / Она есть",pron:"[иль э / эль э]",cat:"Глагол être",ex:"Elle est italienne. → Она итальянка."},
  {fr:"Nous sommes",ru:"Мы есть",pron:"[ну сом]",cat:"Глагол être",ex:"Nous sommes amis. → Мы друзья."},
  {fr:"Vous êtes",ru:"Вы есть",pron:"[ву зэт]",cat:"Глагол être",ex:"Vous êtes monsieur Durand? → Вы господин Дюран?"},
  {fr:"Ils sont",ru:"Они есть",pron:"[иль сон]",cat:"Глагол être",ex:"Ils sont là. → Они здесь."},
  // Национальности
  {fr:"français / française",ru:"французский / французская",pron:"[фран-сэ / фран-сэз]",cat:"Национальности",ex:"Je suis française. → Я француженка."},
  {fr:"russe",ru:"русский / русская",pron:"[рюс]",cat:"Национальности",ex:"Il est russe. → Он русский."},
  {fr:"italien / italienne",ru:"итальянский / итальянская",pron:"[ита-льен / ита-льен]",cat:"Национальности",ex:"Elle est italienne. → Она итальянка."},
  {fr:"allemand / allemande",ru:"немецкий / немецкая",pron:"[аль-ман / аль-манд]",cat:"Национальности",ex:"Il est allemand. → Он немец."},
  {fr:"polonais / polonaise",ru:"польский / польская",pron:"[поло-нэ / поло-нэз]",cat:"Национальности",ex:"Tu es polonais? → Ты польский?"},
  // Прилагательные (мужской/женский)
  {fr:"intéressant / intéressante",ru:"интересный / интересная",pron:"[эн-тэ-рэ-сан / -сант]",cat:"Прилагательные",ex:"Un livre intéressant. → Интересная книга."},
  {fr:"grand / grande",ru:"большой / большая",pron:"[гран / гранд]",cat:"Прилагательные",ex:"Une grande maison. → Большой дом."},
  {fr:"petit / petite",ru:"маленький / маленькая",pron:"[пти / птит]",cat:"Прилагательные",ex:"Un petit chat. → Маленький кот."},
  {fr:"beau / belle",ru:"красивый / красивая",pron:"[бо / бэль]",cat:"Прилагательные",ex:"Tu es belle! → Ты красивая!"},
  {fr:"vieux / vieille",ru:"старый / старая",pron:"[вьё / вьей]",cat:"Прилагательные",ex:"Un vieux tableau. → Старая картина."},
  {fr:"blond / blonde",ru:"светловолосый / светловолосая",pron:"[блон / блонд]",cat:"Прилагательные",ex:"Un enfant blond. → Светловолосый ребёнок."},
  // Спорт и хобби
  {fr:"jouer au foot",ru:"играть в футбол",pron:"[жуэ о фут]",cat:"Спорт",ex:"Je joue au foot le week-end. → Я играю в футбол на выходных."},
  {fr:"jouer au tennis",ru:"играть в теннис",pron:"[жуэ о тэнис]",cat:"Спорт",ex:"Elle joue au tennis depuis 5 ans. → Она играет в теннис уже 5 лет."},
  {fr:"jouer aux échecs",ru:"играть в шахматы",pron:"[жуэ о зэшэк]",cat:"Хобби",ex:"Nous jouons souvent aux échecs. → Мы часто играем в шахматы."},
  {fr:"jouer du piano",ru:"играть на пианино",pron:"[жуэ дю пьяно]",cat:"Хобби",ex:"Il joue du piano depuis un an. → Он играет на пианино уже год."},
  {fr:"faire du vélo",ru:"кататься на велосипеде",pron:"[фэр дю вэло]",cat:"Спорт",ex:"Mon frère fait du vélo tous les jours. → Мой брат катается каждый день."},
  {fr:"faire de la natation",ru:"заниматься плаванием",pron:"[фэр дё ля ната-сьон]",cat:"Спорт",ex:"Je fais de la natation le matin. → Я плаваю по утрам."},
  {fr:"faire du yoga",ru:"заниматься йогой",pron:"[фэр дю йога]",cat:"Спорт",ex:"Ma mère fait du yoga le week-end. → Моя мама занимается йогой на выходных."},
  {fr:"faire de la randonnée",ru:"ходить в походы",pron:"[фэр дё ля рандо-нэ]",cat:"Спорт",ex:"Vous faites de la randonnée ce week-end? → Вы идёте в поход?"},
  // Артикли contracté
  {fr:"au (à + le)",ru:"к / в (мужской род)",pron:"[о]",cat:"Артикли",ex:"Je vais au parc. → Я иду в парк."},
  {fr:"à la",ru:"к / в (женский род)",pron:"[а ля]",cat:"Артикли",ex:"Elle parle à la directrice. → Она говорит с директором."},
  {fr:"à l'",ru:"к / в (перед гласной)",pron:"[а ль]",cat:"Артикли",ex:"Je retourne à l'hôpital. → Я возвращаюсь в больницу."},
  {fr:"aux (à + les)",ru:"к / в (множественное число)",pron:"[о]",cat:"Артикли",ex:"Ils répondent aux professeurs. → Они отвечают преподавателям."},
  // Команды (императив)
  {fr:"Écoutez!",ru:"Слушайте!",pron:"[эку-тэ]",cat:"Императив",ex:"Écoutez la musique! → Слушайте музыку!"},
  {fr:"Répétez!",ru:"Повторите!",pron:"[рэпэ-тэ]",cat:"Императив",ex:"Répétez, s'il vous plaît. → Повторите, пожалуйста."},
  {fr:"Ouvrez la fenêtre!",ru:"Откройте окно!",pron:"[ув-рэ ля фнэтр]",cat:"Императив",ex:"Ouvrez la fenêtre, il fait chaud. → Откройте окно, жарко."},
  {fr:"Fermez la porte!",ru:"Закройте дверь!",pron:"[фэр-мэ ля порт]",cat:"Императив",ex:"Fermez la porte, s'il vous plaît. → Закройте дверь, пожалуйста."},
  {fr:"Regardez!",ru:"Посмотрите!",pron:"[рёгар-дэ]",cat:"Императив",ex:"Regardez le tableau! → Посмотрите на доску!"},
  {fr:"Faites les devoirs!",ru:"Делайте домашнее задание!",pron:"[фэт лэ дёвуар]",cat:"Императив",ex:"Faites les devoirs pour demain. → Сделайте домашнее задание на завтра."},
  // Время
  {fr:"Aujourd'hui",ru:"Сегодня",pron:"[о-жур-дюи]",cat:"Время",ex:"Aujourd'hui, il fait beau. → Сегодня хорошая погода."},
  {fr:"Demain",ru:"Завтра",pron:"[дё-мэн]",cat:"Время",ex:"À demain! → До завтра!"},
  {fr:"Le matin",ru:"Утром",pron:"[лё ма-тэн]",cat:"Время",ex:"Je travaille le matin. → Я работаю утром."},
  {fr:"Le soir",ru:"Вечером",pron:"[лё суар]",cat:"Время",ex:"Je lis le soir. → Я читаю вечером."},
  // Еда
  {fr:"Le pain",ru:"Хлеб",pron:"[лё пэн]",cat:"Еда",ex:"Je voudrais du pain. → Я хотел бы хлеба."},
  {fr:"L'eau",ru:"Вода",pron:"[ло]",cat:"Еда",ex:"De l'eau, s'il vous plaît. → Воды, пожалуйста."},
  {fr:"Le café",ru:"Кофе",pron:"[лё ка-фэ]",cat:"Еда",ex:"Un café au lait. → Кофе с молоком."},
];

const PHRASES = [
  {fr:"Comment vous appelez-vous?",ru:"Как вас зовут?",pron:"[ко-ман ву за-плэ-ву]",cat:"Знакомство"},
  {fr:"Je m'appelle...",ru:"Меня зовут...",pron:"[жё ма-пэль]",cat:"Знакомство"},
  {fr:"Enchanté(e)!",ru:"Очень приятно!",pron:"[ан-шан-тэ]",cat:"Знакомство"},
  {fr:"Vous êtes monsieur Durand?",ru:"Вы господин Дюран?",pron:"[ву зэт мё-сьё дю-ран]",cat:"Знакомство"},
  {fr:"Comment ça va?",ru:"Как дела?",pron:"[ко-ман са ва]",cat:"Приветствие"},

  {fr:"Tournez à gauche.",ru:"Поверните налево.",pron:"[тур-нэ а гош]",cat:"Навигация"},

  {fr:"Je vais au parc tous les dimanches.",ru:"Я хожу в парк каждое воскресенье.",pron:"[жё вэ о парк ту лэ ди-манш]",cat:"Жизнь"},
  {fr:"Nous jouons au football après l'école.",ru:"Мы играем в футбол после школы.",pron:"[ну жуон о фут-боль а-прэ лэколь]",cat:"Спорт"},

const GRAMMAR = [
  {title:"Артикли — les articles",html:`<p class="gram-rule">Артикль обязателен перед каждым существительным. Бывают определённые (le/la/les) и неопределённые (un/une/des).</p><table><tr><th>Тип</th><th>Мужской</th><th>Женский</th><th>Множ.</th></tr><tr><td>Определённый</td><td><strong>le</strong> livre</td><td><strong>la</strong> maison</td><td><strong>les</strong> amis</td></tr><tr><td>Неопределённый</td><td><strong>un</strong> chat</td><td><strong>une</strong> table</td><td><strong>des</strong> pommes</td></tr></table><p class="gram-example">✦ Le chat est sur la table. — Кот на столе.<br>✦ J'ai un chien. — У меня есть собака.</p>`},
  {title:"Глагол être — быть",html:`<p class="gram-rule">Важнейший глагол — нужен для описания кто ты есть, откуда, какой. Учи наизусть!</p><table><tr><th>Лицо</th><th>Форма</th><th>Пример</th></tr><tr><td>Je</td><td><strong>suis</strong></td><td>Je suis russe.</td></tr><tr><td>Tu</td><td><strong>es</strong></td><td>Tu es gentil.</td></tr><tr><td>Il / Elle</td><td><strong>est</strong></td><td>Elle est italienne.</td></tr><tr><td>Nous</td><td><strong>sommes</strong></td><td>Nous sommes amis.</td></tr><tr><td>Vous</td><td><strong>êtes</strong></td><td>Vous êtes Mme Dupuis?</td></tr><tr><td>Ils / Elles</td><td><strong>sont</strong></td><td>Ils sont là.</td></tr></table><p class="gram-example">✦ C'est moi, Mireille! — Это я, Мирей!<br>✦ Qui est-ce? C'est Audrey. — Кто это? Это Одри.</p>`},
  {title:"Прилагательные — мужской и женский род",html:`<p class="gram-rule">Прилагательные во французском согласуются с существительным по роду. Обычно в женском роде добавляется <strong>-e</strong>.</p><table><tr><th>Мужской</th><th>Женский</th><th>Перевод</th></tr><tr><td>intéressant</td><td>intéressant<strong>e</strong></td><td>интересный/ая</td></tr><tr><td>grand</td><td>grand<strong>e</strong></td><td>большой/ая</td></tr><tr><td>blond</td><td>blond<strong>e</strong></td><td>светловолосый/ая</td></tr><tr><td>ancien</td><td>ancienne</td><td>старый/ая</td></tr><tr><td>beau</td><td>belle</td><td>красивый/ая</td></tr><tr><td>vieux</td><td>vieille</td><td>старый/ая</td></tr></table><p class="gram-example">✦ Un gars intéressant → une fille intéressante.<br>✦ Un tableau ancien → une lampe ancienne.</p>`},
  {title:"Артикли contracté — au, à la, à l', aux",html:`<p class="gram-rule">Предлог <strong>à</strong> (к, в) сливается с артиклем:<br><strong>à + le = au</strong> · <strong>à + les = aux</strong> · <strong>à la</strong> и <strong>à l'</strong> не меняются.</p><table><tr><th>Форма</th><th>Когда</th><th>Пример</th></tr><tr><td><strong>au</strong></td><td>мужской род</td><td>Je vais <strong>au</strong> parc.</td></tr><tr><td><strong>à la</strong></td><td>женский род</td><td>Elle parle <strong>à la</strong> directrice.</td></tr><tr><td><strong>à l'</strong></td><td>перед гласной</td><td>Je retourne <strong>à l'</strong>hôpital.</td></tr><tr><td><strong>aux</strong></td><td>множественное</td><td>Ils répondent <strong>aux</strong> professeurs.</td></tr></table><p class="gram-example">✦ Nous jouons au football. — Мы играем в футбол.<br>✦ Il pense souvent aux vacances. — Он часто думает об отпуске.</p>`},
  {title:"Faire ou Jouer? — спорт и хобби",html:`<p class="gram-rule">Два глагола для занятий спортом. У каждого свои правила!</p><table><tr><th>JOUER (играть)</th><th>FAIRE (заниматься)</th></tr><tr><td><strong>au/à la/aux</strong> — командные виды и игры:<br>jouer au foot, au tennis,<br>jouer aux échecs, aux cartes</td><td><strong>du/de la/de l'</strong> — спорт и активности:<br>faire du vélo, du yoga,<br>faire de la natation, de la randonnée</td></tr><tr><td><strong>du/de la</strong> — музыкальный инструмент:<br>jouer du piano, de la guitare</td><td><strong>du/de la</strong> — инструмент тоже возможно:<br>faire du piano, du violon</td></tr></table><p class="gram-example">✦ Je joue au foot. — Я играю в футбол.<br>✦ Elle fait de la natation. — Она занимается плаванием.<br>✦ Il joue du piano depuis un an. — Он играет на пианино уже год.</p>`},
  {title:"Отрицание — ne...pas",html:`<p class="gram-rule">Отрицание строится по схеме: <strong>ne + глагол + pas</strong>.</p><table><tr><th>Утверждение</th><th>Отрицание</th></tr><tr><td>Je parle français.</td><td>Je <strong>ne</strong> parle <strong>pas</strong> français.</td></tr><tr><td>Il est là.</td><td>Il <strong>n'est pas</strong> là.</td></tr><tr><td>Elle mange.</td><td>Elle <strong>ne</strong> mange <strong>pas</strong>.</td></tr></table><p class="gram-example">✦ Annette n'est pas là. Elle est à Marseille. — Аннет нет дома. Она в Марселе.<br>✦ В разговорной речи «ne» часто опускают: «Je comprends pas.»</p>`},
  {title:"Императив — команды и просьбы",html:`<p class="gram-rule">Повелительное наклонение — как давать команды или просьбы. Три формы: tu (ты), nous (мы), vous (вы).</p><table><tr><th>Русский</th><th>vous (вы)</th><th>tu (ты)</th><th>nous (мы)</th></tr><tr><td>Слушайте!</td><td>Écoutez!</td><td>Écoute!</td><td>Écoutons!</td></tr><tr><td>Смотрите!</td><td>Regardez!</td><td>Regarde!</td><td>Regardons!</td></tr><tr><td>Откройте!</td><td>Ouvrez!</td><td>Ouvre!</td><td>Ouvrons!</td></tr><tr><td>Закройте!</td><td>Fermez!</td><td>Ferme!</td><td>Fermons!</td></tr><tr><td>Повторите!</td><td>Répétez!</td><td>Répète!</td><td>Répétons!</td></tr></table><p class="gram-example">✦ Écoutez la musique! — Слушайте музыку!<br>✦ Regardons ce film. — Давайте посмотрим этот фильм.<br>✦ Faites les devoirs. — Делайте домашнее задание.</p>`},
  {title:"Числа 1–100 — les chiffres",html:`<table><tr><th>№</th><th>Французский</th><th>Произн.</th><th>№</th><th>Французский</th><th>Произн.</th></tr><tr><td>1</td><td>un/une</td><td>[ын]</td><td>11</td><td>onze</td><td>[онз]</td></tr><tr><td>2</td><td>deux</td><td>[дё]</td><td>12</td><td>douze</td><td>[дуз]</td></tr><tr><td>3</td><td>trois</td><td>[труа]</td><td>13</td><td>treize</td><td>[трэз]</td></tr><tr><td>4</td><td>quatre</td><td>[катр]</td><td>20</td><td>vingt</td><td>[вэн]</td></tr><tr><td>5</td><td>cinq</td><td>[сэнк]</td><td>30</td><td>trente</td><td>[трант]</td></tr><tr><td>6</td><td>six</td><td>[сис]</td><td>40</td><td>quarante</td><td>[ка-рант]</td></tr><tr><td>7</td><td>sept</td><td>[сэт]</td><td>50</td><td>cinquante</td><td>[сэн-кант]</td></tr><tr><td>8</td><td>huit</td><td>[юит]</td><td>60</td><td>soixante</td><td>[суа-сант]</td></tr><tr><td>9</td><td>neuf</td><td>[нёф]</td><td>70</td><td>soixante-dix</td><td>[суа-сант-дис]</td></tr><tr><td>10</td><td>dix</td><td>[дис]</td><td>100</td><td>cent</td><td>[сан]</td></tr></table><p class="gram-example">✦ J'ai vingt-cinq ans. — Мне 25 лет.<br>✦ Il habite au numéro quarante. — Он живёт в доме номер 40.</p>`},
  {title:"Глагол avoir — иметь",html:`<p class="gram-rule">Второй важнейший глагол. Нужен для описания того, что у тебя есть, и для выражения возраста.</p><table><tr><th>Лицо</th><th>Форма</th><th>Пример</th></tr><tr><td>Je</td><td><strong>ai</strong></td><td>J'ai un chat.</td></tr><tr><td>Tu</td><td><strong>as</strong></td><td>Tu as quel âge?</td></tr><tr><td>Il / Elle</td><td><strong>a</strong></td><td>Elle a 25 ans.</td></tr><tr><td>Nous</td><td><strong>avons</strong></td><td>Nous avons un chien.</td></tr><tr><td>Vous</td><td><strong>avez</strong></td><td>Vous avez les courses.</td></tr><tr><td>Ils / Elles</td><td><strong>ont</strong></td><td>Ils ont des enfants.</td></tr></table><p class="gram-example">✦ J'ai une grande famille. — У меня большая семья.<br>✦ Elle a 25 ans. — Ей 25 лет. (Возраст = avoir!)</p>`},
];

let wIdx=0, wFlipped=false, wKnown=0, wLearn=0;
let pIdx=0, pFlipped=false;
let gIdx=0;
let totalSec=600, timerInt=null, timerStarted=false;
let activeCat='Все';
let filteredWords=[];

function getCategories() {
  const cats = ['Все', ...new Set(WORDS.map(w=>w.cat))];
  return cats;
}

function buildFilters() {
  const cats = getCategories();
  const row = document.getElementById('cat-filters');
  row.innerHTML = cats.map(c=>`<button class="filter-btn${c===activeCat?' active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');
}

function setFilter(cat) {
  activeCat = cat;
  filteredWords = cat==='Все' ? [...WORDS] : WORDS.filter(w=>w.cat===cat);
  wIdx=0; wFlipped=false;
  buildFilters();
  showWord();
}

function loadStreak() { try { return JSON.parse(localStorage.getItem('fr_streak')||'[]'); } catch(e){return[];} }
function saveStreak(arr) { try { localStorage.setItem('fr_streak',JSON.stringify(arr)); } catch(e){} }
function todayStr() { return new Date().toISOString().slice(0,10); }
function renderStreak() {
  const arr=loadStreak(), today=todayStr(), bar=document.getElementById('streak-bar');
  const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const s=d.toISOString().slice(0,10);const label=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()];days.push({s,label,done:arr.includes(s),today:s===today});}
  bar.innerHTML=days.map(d=>`<div class="streak-day${d.done?' done':''}${d.today&&!d.done?' today':''}">${d.done?'✓':d.label}</div>`).join('')+`<span class="streak-label">серия: ${getStreakCount(arr)} дн.</span>`;
}
function getStreakCount(arr){let c=0,d=new Date();while(true){const s=d.toISOString().slice(0,10);if(arr.includes(s)){c++;d.setDate(d.getDate()-1);}else break;}return c;}
function markToday(){const arr=loadStreak(),t=todayStr();if(!arr.includes(t)){arr.push(t);saveStreak(arr);}renderStreak();}

function startTimer(){if(timerStarted)return;timerStarted=true;document.getElementById('timer-status').textContent='идёт';timerInt=setInterval(()=>{totalSec--;updateTimerUI();if(totalSec<=0){clearInterval(timerInt);finishSession();}},1000);}
function updateTimerUI(){const m=Math.floor(totalSec/60),s=totalSec%60;document.getElementById('timer-text').textContent=m+':'+(s<10?'0':'')+s;const pct=totalSec/600,c=188.5;document.getElementById('timer-arc').style.strokeDashoffset=Math.round(c*(1-pct));if(totalSec<=60)document.getElementById('timer-arc').style.stroke='#e07070';else if(totalSec<=180)document.getElementById('timer-arc').style.stroke='#c9a96e';}
function finishSession(){markToday();document.querySelector('main').innerHTML=`<div class="done-screen"><div class="done-flag">🇫🇷</div><div class="done-title">Bravo! Отличная работа!</div><p class="done-sub">10 минут французского — сделано на сегодня.</p><div class="done-stats"><div class="done-stat"><span>${wKnown}</span><small>Знал</small></div><div class="done-stat"><span>${wLearn}</span><small>Учу</small></div><div class="done-stat"><span>${wKnown+wLearn}</span><small>Карточек</small></div></div><p class="done-sub">Возвращайся завтра — и французский станет ближе.<br>À demain! 👋</p><button class="btn-restart" onclick="location.reload()">Ещё раз →</button></div>`;}

function showWord(){
  const w=filteredWords[wIdx];
  if(!w)return;
  wFlipped=false;
  document.getElementById('w-cat').textContent=w.cat;
  document.getElementById('w-fr').textContent=w.fr;
  document.getElementById('w-pron').textContent=w.pron;
  document.getElementById('w-ru').textContent=w.ru;
  document.getElementById('w-ex').textContent='✦ '+w.ex;
  document.getElementById('w-ru').style.display='none';
  document.getElementById('w-ex').style.display='none';
  document.getElementById('w-btns').style.display='none';
  document.getElementById('w-next').style.display='none';
  document.getElementById('w-hint').textContent='нажми чтобы открыть';
  document.getElementById('w-prog').textContent=(wIdx+1)+' / '+filteredWords.length;
}
function flipWord(){if(wFlipped)return;wFlipped=true;document.getElementById('w-ru').style.display='block';document.getElementById('w-ex').style.display='block';document.getElementById('w-btns').style.display='flex';document.getElementById('w-hint').textContent='знал?';startTimer();}
function markWord(ok){if(ok)wKnown++;else wLearn++;document.getElementById('w-btns').style.display='none';document.getElementById('w-next').style.display='block';document.getElementById('s-know').textContent=wKnown;document.getElementById('s-nope').textContent=wLearn;document.getElementById('s-tot').textContent=wKnown+wLearn;}
function nextWord(){wIdx=(wIdx+1)%filteredWords.length;showWord();}

function showPhrase(){const p=PHRASES[pIdx];pFlipped=false;document.getElementById('ph-cat').textContent=p.cat;document.getElementById('ph-fr').textContent=p.fr;document.getElementById('ph-pron').textContent=p.pron;document.getElementById('ph-ru').textContent=p.ru;document.getElementById('ph-ru').style.display='none';document.getElementById('ph-hint').textContent='нажми чтобы открыть';document.getElementById('ph-prog').textContent=(pIdx+1)+' / '+PHRASES.length;}
function flipPhrase(){if(pFlipped)return;pFlipped=true;document.getElementById('ph-ru').style.display='block';document.getElementById('ph-hint').textContent='✓';startTimer();}
function nextPhrase(){pIdx=(pIdx+1)%PHRASES.length;showPhrase();}

function showGram(){const g=GRAMMAR[gIdx];document.getElementById('gram-content').innerHTML=`<div class="gram-card"><div class="gram-title">${g.title}</div>${g.html}</div>`;document.getElementById('gr-prog').textContent=(gIdx+1)+' / '+GRAMMAR.length;}
function nextGram(){gIdx=(gIdx+1)%GRAMMAR.length;showGram();}

function switchTab(name,btn){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('panel-'+name).classList.add('active');btn.classList.add('active');startTimer();}

document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){const a=document.querySelector('.panel.active');if(a&&a.id==='panel-words'&&!wFlipped)flipWord();if(a&&a.id==='panel-phrases'&&!pFlipped)flipPhrase();}});

// Init
filteredWords=[...WORDS];
buildFilters();
renderStreak();
showWord();
showPhrase();
showGram();
</script>
